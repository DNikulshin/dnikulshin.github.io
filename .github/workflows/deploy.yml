name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI'] # Имя workflow CI (должно совпадать с именем в ci.yml)
    branches: [main] # Только для main
    types:
      - completed # Запускаем после завершения CI

# Разрешения для деплоя
permissions:
  contents: read
  pages: write
  id-token: write

# Гарантируем, что запускается только один деплой одновременно
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Запускаем только если CI завершился успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем pnpm — версия читается из package.json (packageManager)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version не указываем — автоматически берётся из package.json

      # Настраиваем Node.js 22+ (совместим с pnpm 11)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Сборка статики (используем GITHUB_TOKEN для API)
      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '' }}

      # Загружаем артефакт для GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # Деплоим на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
