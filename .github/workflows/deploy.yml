name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешаем запись в Pages и чтение содержимого
permissions:
  contents: read
  pages: write
  id-token: write

# Гарантируем, что запускается только один деплой одновременно
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Устанавливаем pnpm — версия автоматически читается из package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version не указываем — экшен читает поле "packageManager" из package.json

      # 2. Настраиваем Node.js и кэш для pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Сборка статического сайта
      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '' }}

      # 5. Загружаем артефакт для GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
